symbol: NQ
timezone: America/New_York

excel:
  path: data/nq_minute.xlsx
  sheet_name: bars
  timestamp_col: timestamp
  ohlc:
    open: open
    high: high
    low: low
    close: close

sessions:
  asia:
    start: "20:00"
    end: "04:00"
  london:
    start: "03:00"
    end: "07:00"
  ny:
    start: "09:30"
    end: "16:00"

ny_open:
  lookback_minutes: 60
  use_most_recent_sessions_only: true

prev_day:
  rth_only: true
  rth_start: "09:30"
  rth_end: "16:00"

swing_4h:
  resample: "240T"
  left_right_bars: 2

market:
  tick_size: 0.25
  tick_value: 5.0

proximity:
  near: 12
  very_near: 6
  cluster_within_ticks: 10
  staleness_penalty: 0.5

entry:
  direction: both
  sweep_confirm: true
  retrace_bars: 3
  time_limit_minutes: 90

risk:
  stop_at_nearest_support_resistance: true
  stop_padding_ticks: 2
  take_profit:
    mode: rr
    rr_multiple: 2.0

backtest:
  start_date: 2024-01-01
  end_date: 2025-09-18
  max_trades_per_day: 1
  slippage_ticks: 1
  commission_per_contract: 2.5
  contracts: 1

plot:
  snapshot_bars_before: 120
  snapshot_bars_after: 60
  show_labels: true
